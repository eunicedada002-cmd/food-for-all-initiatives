<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate - Food for All Initiative</title>
</head>

<body>

    <h1>Support Food for All Initiative</h1>

    <p>
        Your donation can help us provide food to vulnerable
        families and communities across Kenya.
    </p>

    <h2>Make a Difference Today</h2>

    <form>
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="amount">Donation Amount (KES):</label><br>
        <input type="number" id="amount" name="amount" min="1" required><br><br>

        <button type="submit">Donate Now</button>
    </form>

    <p><a href="index.html">Back to Home</a></p>

</body>
</html>
